name: Validate content

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/validate-content.mjs

  # After a merge to main, bumps site's `content` submodule pointer to this
  # commit so the live site picks up the new post without a manual step.
  # Requires a SITE_SYNC_TOKEN repo secret (Settings > Secrets and variables
  # > Actions): a token with write access to the site repo's contents.
  sync-site:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          repository: systems-resarch-at-iba/site
          token: ${{ secrets.SITE_SYNC_TOKEN }}
          submodules: true

      - name: Bump content submodule to this commit
        run: |
          cd content
          git fetch origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA"
          cd ..

          if git diff --quiet -- content; then
            echo "content submodule already up to date, nothing to sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "Sync content submodule to blog@${GITHUB_SHA:0:7}"
          git push
